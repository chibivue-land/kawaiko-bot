name: CI

on:
  pull_request:
  push:
    branches: [main]

# 読むだけ．CI は何も書き換えないし，秘密も要らない．
permissions:
  contents: read

# 同じ枝に続けて push したら，追い越された回は畳む。
# main は畳まない — その回の結果がデプロイの前提になっているので。
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # このジョブは push しない．走っている間ジョブのトークンを
          # .git/config に置いたままにしない．
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        # store は setup-node が持っている。ネットへ出るのは，そこに無いものだけ。
        run: pnpm install --frozen-lockfile --prefer-offline

      - name: Put vp on PATH
        run: echo "$PWD/node_modules/.bin" >> "$GITHUB_PATH"

      # Vite Task の結果キャッシュ。鍵は読んだファイルの中身なので、
      # 触っていないタスクは走らずに前の結果を再生する。
      # install より後に置く (node_modules ごと作り直されるため)。
      - name: Restore the task cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: node_modules/.vite/task-cache
          key: vp-task-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.sha }}
          restore-keys: |
            vp-task-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-
            vp-task-${{ runner.os }}-

      - name: Lint / format / typecheck
        run: vp run 確認

      - name: Test
        run: vp run 試験

      - name: Build
        run: vp run 組み立て
