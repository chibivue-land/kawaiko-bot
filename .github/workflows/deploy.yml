name: Deploy

on:
  push:
    branches: [main]

# Cloudflare の資格情報は環境変数から渡す．GitHub 側のトークンには何も要らない．
permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # このジョブは push しない．走っている間ジョブのトークンを
          # .git/config に置いたままにしない．
          persist-credentials: false

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Put vp on PATH
        run: echo "$PWD/node_modules/.bin" >> "$GITHUB_PATH"

      - name: Test
        run: vp test

      # Skipped until the d1_databases binding is uncommented in wrangler.jsonc
      # (commented lines cannot match the anchored pattern).
      - name: Apply D1 migrations
        run: |
          if grep -qE '^[[:space:]]*"d1_databases"' wrangler.jsonc; then
            wrangler d1 migrations apply kawaiko-bot --remote
          else
            echo "D1 binding not configured yet; skipping migrations"
          fi
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy Worker (build + wrangler deploy via Vite Task)
        run: vp run deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      # GitHub Secrets are the source of truth; push them to the Worker on every deploy.
      - name: Sync Worker secrets
        run: |
          jq -n \
            --arg discord "$DISCORD_BOT_TOKEN" \
            --arg gemini "$GEMINI_API_KEY" \
            --arg trigger "$TRIGGER_TOKEN" \
            --arg ghtoken "$GH_API_TOKEN" \
            '{DISCORD_BOT_TOKEN: $discord, GEMINI_API_KEY: $gemini, TRIGGER_TOKEN: $trigger, GITHUB_API_TOKEN: $ghtoken}' \
            | wrangler secret bulk
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TRIGGER_TOKEN: ${{ secrets.TRIGGER_TOKEN }}
          GH_API_TOKEN: ${{ secrets.GH_API_TOKEN }}
