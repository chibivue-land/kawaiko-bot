name: Mutter

# Manually make kawaiko post right now (bypasses the probability gate,
# still subject to the monthly budget guard).
on:
  workflow_dispatch:
    inputs:
      kind:
        description: What kawaiko should do
        type: choice
        default: mutter
        options:
          - mutter
          - reply

permissions:
  contents: read

jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger kawaiko
        run: |
          # wait=1 returns the outcome JSON so failures show up right here.
          curl -sf -X POST \
            "https://kawaiko-bot.ubuge1122.workers.dev/trigger/$KIND?wait=1" \
            -H "Authorization: Bearer $TRIGGER_TOKEN"
        env:
          TRIGGER_TOKEN: ${{ secrets.TRIGGER_TOKEN }}
          # 入力は run の中へ直接展開しない (provision.yml と同じ理由)．
          KIND: ${{ inputs.kind }}
